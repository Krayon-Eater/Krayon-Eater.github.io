<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lets Play Chess</title>

    <link rel="stylesheet" href="chess-style.css">
</head>
<body>
    <div id="main-container">
        <div id="chessboard">
            <div id="top-row">
                <div class="black-tile"></div>
                <div class="white-tile">A</div>
                <div class="black-tile">B</div>
                <div class="white-tile">C</div>
                <div class="black-tile">D</div>
                <div class="white-tile">E</div>
                <div class="black-tile">F</div>
                <div class="white-tile">G</div>
                <div class="black-tile">H</div>
            </div>
            <div id="left-column">
                <div class="white-tile">8</div>
                <div class="black-tile">7</div>
                <div class="white-tile">6</div>
                <div class="black-tile">5</div>
                <div class="white-tile">4</div>
                <div class="black-tile">3</div>
                <div class="white-tile">2</div>
                <div class="black-tile">1</div>
            </div>
            <div id="play-area">
                <div class="black-tile"><img src="img/B-Rook.png" alt="Black Rook"></div>
                <div class="white-tile"><img src="img/B-Knight.png" alt="Black Knight"></div>
                <div class="black-tile"><img src="img/B-Bishop.png" alt="Black Bishop"></div>
                <div class="white-tile"><img src="img/B-King.png" alt="Black King"></div>
                <div class="black-tile"><img src="img/B-Queen.png" alt="Black Queen"></div>
                <div class="white-tile"><img src="img/B-Bishop.png" alt="Black Bishop"></div>
                <div class="black-tile"><img src="img/B-Knight.png" alt="Black Knight"></div>
                <div class="white-tile"><img src="img/B-Rook.png" alt="Black Rook"></div>
    
                <div class="white-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                <div class="black-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                <div class="white-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                <div class="black-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                <div class="white-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                <div class="black-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                <div class="white-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                <div class="black-tile"><img src="img/B-Pawn.png" alt="Black B-Pawn"></div>
                
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
    
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
    
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
    
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                <div class="white-tile"></div>
                <div class="black-tile"></div>
                
                <div class="black-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
                <div class="white-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
                <div class="black-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
                <div class="white-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
                <div class="black-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
                <div class="white-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
                <div class="black-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
                <div class="white-tile"><img src="img/W-Pawn.png" alt="White Pawn"></div>
    
                <div class="white-tile"><img src="img/W-Rook.png" alt="White Rook"></div>
                <div class="black-tile"><img src="img/W-Knight.png" alt="White Knight"></div>
                <div class="white-tile"><img src="img/W-Bishop.png" alt="White Bishop"></div>
                <div class="black-tile"><img src="img/W-King.png" alt="White King"></div>
                <div class="white-tile"><img src="img/W-Queen.png" alt="White Queen"></div>
                <div class="black-tile"><img src="img/W-Bishop.png" alt="White Bishop"></div>
                <div class="white-tile"><img src="img/W-Knight.png" alt="White Knight"></div>
                <div class="black-tile"><img src="img/W-Rook.png" alt="White Rook"></div>
    
            </div>
        </div>
    </div>
</body>
</html>
