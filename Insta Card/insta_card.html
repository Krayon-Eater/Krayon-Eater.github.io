<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Card</title>

    <link rel="stylesheet" href="insta_card.css">
</head>
<body id="main-container">
    <div id="insta-card">
        <div id="insta-card-header">
            <div id>PFP</div>
            <div>
                <div>Username</div>
                <div>Location</div>
            </div>
        </div>
        <!-- The image is from the manga "Kaiju No. 8" by Naoya Matsumoto. It is used here for educational purposes to demonstrate the layout of an Instagram card. -->
        <img id="insta-card-img" src="img/kaiju8.png" alt="kaiju8">
        <div id="insta-card-footer">
            <div>
                <div class="icons">Like</div>
                <div class="icons">Comment</div>
                <div class="icons">Share</div>
            </div>
            <div>
                <div>Caption</div>
                <div>Comments</div>
            </div>
        </div>
    </div>
</body>
</html>
